[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codewizard-db"
version = "0.1.0"
description = "Storage backends (local JSON / local Postgres / Supabase REST) for CodeWizard-DevOpsAgents"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["codewizard_db*"]
